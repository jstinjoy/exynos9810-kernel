name: build-ksu-susfs-q
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install deps
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison flex libssl-dev libncurses-dev build-essential \
            libelf-dev zip git ca-certificates wget python3 kmod cpio rsync curl file \
            libc6-i386 lib32stdc++6 lib32z1 libxml2 \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          DEBIAN_FRONTEND=noninteractive apt-get install -y python2 || true
          ln -sf /usr/bin/python2 /usr/bin/python 2>/dev/null || true
          DEBIAN_FRONTEND=noninteractive apt-get install -y libtinfo5 || true

      - name: Checkout (no submodules; KSU is swapped below)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Swap KSU driver -> vanilla tiann/KernelSU + enable SUSFS (non-GKI recipe)
        run: |
          set -euxo pipefail
          git clone --depth=1 -b kernel-4.9 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs
          # Replace duhansysl's custom KSU-Next (no SUSFS) with vanilla KSU at the path the symlink expects
          rm -rf KernelSU-Next
          git clone --depth=1 -b v3.2.4 https://github.com/tiann/KernelSU KernelSU-Next
          pushd KernelSU-Next
          # Revert the commit SUSFS needs reverted (no-op if already absent)
          curl -LSs "https://github.com/tiann/KernelSU/commit/898e9d4f8ca9b2f46b0c6b36b80a872b5b88d899.patch" -o /tmp/revert.patch
          patch -R -p1 --no-backup-if-mismatch < /tmp/revert.patch || echo "revert: hunks absent/already-reverted, continuing"
          # Apply the SUSFS KSU-side enable patch (adds CONFIG_KSU_SUSFS + driver integration)
          cp /tmp/susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch .
          patch -p1 < 10_enable_susfs_for_ksu.patch
          # Non-GKI: disable kprobe hooks (we use the manual hooks already committed in the kernel source)
          grep -rl '#ifdef CONFIG_KPROBES' kernel/ 2>/dev/null | xargs -r sed -i 's/#ifdef CONFIG_KPROBES/#if defined(CONFIG_KPROBES) \&\& 0/g' || true
          echo "--- KSU_SUSFS now in KSU Kconfig? ---"
          grep -c "KSU_SUSFS" kernel/Kconfig || true
          popd
          echo "--- drivers/kernelsu resolves to vanilla KSU? ---"
          ls -la drivers/kernelsu KernelSU-Next/kernel/Kconfig

      - name: Fetch Clang (clang+lld)
        run: |
          set -euxo pipefail
          mkdir -p clang && cd clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz -O clang.tar.gz
          tar xzf clang.tar.gz && rm clang.tar.gz
          cd "$GITHUB_WORKSPACE"
          ./clang/bin/clang --version

      - name: Build (KSU + SUSFS, clang+lld, recent GNU as)
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export ANDROID_MAJOR_VERSION=q
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KBUILD_BUILD_USER=ci KBUILD_BUILD_HOST=ksususfs
          ARGS="CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++ HOSTCFLAGS=-fcommon HOSTLDFLAGS=-fuse-ld=lld"
          make $ARGS exynos9810_defconfig
          cat arch/arm64/configs/star2lte_defconfig >> .config
          printf '%s\n' \
            CONFIG_KSU=y \
            CONFIG_KSU_SUSFS=y \
            CONFIG_KSU_SUSFS_SUS_PATH=y \
            CONFIG_KSU_SUSFS_SUS_MOUNT=y \
            CONFIG_KSU_SUSFS_SUS_KSTAT=y \
            CONFIG_KSU_SUSFS_TRY_UMOUNT=y \
            CONFIG_KSU_SUSFS_SPOOF_UNAME=y \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y \
            CONFIG_KSU_SUSFS_ENABLE_LOG=y \
            CONFIG_KPROBES=y \
            CONFIG_KALLSYMS=y \
            CONFIG_KALLSYMS_ALL=y \
            CONFIG_OVERLAY_FS=y \
            'CONFIG_LTO_NONE=y' \
            '# CONFIG_LTO_CLANG is not set' \
            '# CONFIG_CFI_CLANG is not set' \
            '# CONFIG_CFI is not set' \
            '# CONFIG_SHADOW_CALL_STACK is not set' \
            '# CONFIG_COMPAT_VDSO is not set' \
            >> .config
          make $ARGS olddefconfig
          echo "=== effective KSU/SUSFS config ==="
          grep -E "CONFIG_KSU" .config || true
          make -j"$(nproc)" $ARGS Image 2>&1 | tee build.log

      - name: List output
        if: always()
        run: ls -la arch/arm64/boot/ 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksu-susfs-q-Image
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/Image.gz
            build.log
          if-no-files-found: warn
