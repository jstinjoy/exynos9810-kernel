name: build-ksu-susfs-q
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install deps
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison flex libssl-dev libncurses-dev build-essential \
            libelf-dev zip git ca-certificates wget python3 kmod cpio rsync curl file \
            libc6-i386 lib32stdc++6 lib32z1
          DEBIAN_FRONTEND=noninteractive apt-get install -y python2 || true
          ln -sf /usr/bin/python2 /usr/bin/python 2>/dev/null || true
          DEBIAN_FRONTEND=noninteractive apt-get install -y libtinfo5 || true

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch Clang (clang+lld) + GCC binutils
        run: |
          set -euxo pipefail
          mkdir -p clang && cd clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz -O clang.tar.gz
          tar xzf clang.tar.gz && rm clang.tar.gz
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32
          ./clang/bin/clang --version
          ./clang/bin/ld.lld --version

      - name: Build (KSU + SUSFS, clang+lld)
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export ANDROID_MAJOR_VERSION=q
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KBUILD_BUILD_USER=ci KBUILD_BUILD_HOST=ksususfs
          ARGS="CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++ HOSTCFLAGS=-fcommon HOSTLDFLAGS=-fuse-ld=lld CLANG_TRIPLE=aarch64-linux-gnu-"
          make $ARGS star2lte_defconfig
          printf '%s\n' \
            CONFIG_KSU=y \
            CONFIG_KSU_SUSFS=y \
            CONFIG_KSU_SUSFS_SUS_PATH=y \
            CONFIG_KSU_SUSFS_SUS_MOUNT=y \
            CONFIG_KSU_SUSFS_SUS_KSTAT=y \
            CONFIG_KSU_SUSFS_TRY_UMOUNT=y \
            CONFIG_KSU_SUSFS_SPOOF_UNAME=y \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y \
            CONFIG_KSU_SUSFS_ENABLE_LOG=y \
            CONFIG_KALLSYMS=y \
            CONFIG_KALLSYMS_ALL=y \
            CONFIG_OVERLAY_FS=y \
            >> .config
          make $ARGS olddefconfig
          echo "=== effective KSU/SUSFS config ==="
          grep -E "CONFIG_KSU" .config || true
          make -j"$(nproc)" $ARGS Image 2>&1 | tee build.log

      - name: List output
        if: always()
        run: ls -la arch/arm64/boot/ 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksu-susfs-q-Image
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/Image.gz
            build.log
          if-no-files-found: warn
